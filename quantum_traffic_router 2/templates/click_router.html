<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Click-Anywhere Route Optimizer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>{{ leaflet_css|safe }}</style>
<script>{{ leaflet_js|safe }}</script>
<style>
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #map { position:absolute; top:64px; bottom:0; left:0; right:0; cursor: crosshair; }
  #topbar {
    height:64px; display:flex; align-items:center; gap:10px; padding:0 16px;
    background:#1b2733; color:white; box-sizing:border-box; flex-wrap:wrap;
  }
  #topbar h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  #topbar select, #topbar button, #topbar input {
    font-size:13px; padding:6px 10px; border-radius:6px; border:1px solid #46586b;
    background:#26374a; color:white; cursor:pointer;
  }
  #searchWrap { position:relative; }
  #searchWrap input { cursor:text; width:220px; }
  #searchWrap input::placeholder { color:#8ba0b5; }
  #suggestions {
    position:absolute; top:38px; left:0; width:320px; max-height:260px; overflow-y:auto;
    background:white; color:#1b2733; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.35);
    z-index:1000; display:none;
  }
  #suggestions .suggestion {
    padding:8px 12px; font-size:12.5px; border-bottom:1px solid #eee; cursor:pointer; line-height:1.4;
  }
  #suggestions .suggestion:last-child { border-bottom:none; }
  #suggestions .suggestion:hover { background:#f0f4f8; }
  #topbar button:disabled { opacity:0.4; cursor:not-allowed; }
  #topbar button.primary { background:#9b59b6; border-color:#9b59b6; }
  #topbar button.danger { background:#c0392b; border-color:#c0392b; }
  #topbar button.search { background:#2980b9; border-color:#2980b9; cursor:pointer; }
  #hint {
    position:absolute; top:78px; left:50%; transform:translateX(-50%); background:white; padding:8px 16px;
    border-radius:8px; font-size:13px; box-shadow:0 1px 6px rgba(0,0,0,.3); z-index:600; text-align:center;
    max-width:600px;
  }
  #stats {
    position:absolute; bottom:16px; left:16px; background:white; padding:12px 16px;
    border-radius:8px; font-size:12px; box-shadow:0 1px 6px rgba(0,0,0,.3); z-index:500; max-width:300px; line-height:1.7;
    display:none;
  }
  #stats b { color:#1b2733; }
  #stats .warn { color:#c0392b; font-weight:600; }
  #directions {
    position:absolute; top:78px; right:16px; width:300px; max-height:calc(100vh - 160px);
    background:white; border-radius:8px; box-shadow:0 1px 6px rgba(0,0,0,.3); z-index:500;
    display:none; overflow:hidden; flex-direction:column;
  }
  #directions-header {
    padding:10px 14px; font-size:13px; font-weight:700; color:#1b2733; border-bottom:1px solid #eee;
    display:flex; justify-content:space-between; align-items:center;
  }
  #directions-header button {
    background:none; border:none; color:#8ba0b5; font-size:16px; cursor:pointer; padding:0 4px; line-height:1;
  }
  #directions-list { list-style:none; margin:0; padding:6px 0; overflow-y:auto; max-height:calc(100vh - 210px); }
  #directions-list li {
    padding:8px 14px; font-size:12.5px; color:#2c3e50; line-height:1.5; border-bottom:1px solid #f2f2f2;
  }
  #directions-list li:last-child { border-bottom:none; }
  #directions-list li .dist { color:#8ba0b5; font-size:11px; display:block; margin-top:2px; }
  #directions-list li.stop-marker { background:#f7f4fb; font-weight:600; color:#7d3c98; }
  #error {
    position:absolute; top:78px; left:50%; transform:translateX(-50%); background:#c0392b; color:white; padding:8px 16px;
    border-radius:8px; font-size:13px; box-shadow:0 1px 6px rgba(0,0,0,.3); z-index:600; display:none; max-width:600px; text-align:center;
  }
  .pin-label {
    background:#2c3e50; color:white; border-radius:50%; width:26px; height:26px;
    text-align:center; line-height:26px; font-size:12px; font-weight:600; box-shadow:0 0 0 2px white;
  }
  .pin-start { background:#27ae60; }
  .pin-end { background:#c0392b; }
</style>
</head>
<body>
<div id="topbar">
  <h1>Click-Anywhere Route Optimizer</h1>
  <select id="citySelect">
    {% for c in cities %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
  </select>
  <select id="basemapSelect">
    <option value="satellite">Satellite view</option>
    <option value="street">Street map</option>
  </select>
  <select id="methodSelect">
    <option value="quantum">Quantum-inspired (QUBO + SA)</option>
    <option value="classical">Classical (nearest-neighbor + 2-opt)</option>
  </select>
  <select id="hourSelect" title="Simulated time of day (affects estimated traffic)">
    <option value="now">Now</option>
    <option value="9">Morning peak (9 AM)</option>
    <option value="13">Midday (1 PM)</option>
    <option value="18.5">Evening peak (6:30 PM)</option>
    <option value="23">Late night (11 PM)</option>
  </select>
  <div id="searchWrap">
    <input id="searchInput" type="text" placeholder="Search a place, address, or landmark..." autocomplete="off">
    <div id="suggestions"></div>
  </div>
  <button id="solveBtn" class="primary" disabled>Solve route</button>
  <button id="clearBtn" class="danger">Clear points</button>
</div>
<div id="map"></div>
<div id="hint">Click the map, or search a place above, to drop a <b>Start</b> point, then an <b>End</b> point, then any stops in between (up to {{ max_stops }} total). Routes follow real streets, powered by OSRM.</div>
<div id="error"></div>
<div id="stats"></div>
<div id="directions">
  <div id="directions-header">
    <span>Turn-by-turn directions</span>
    <button id="directionsClose" title="Hide">&times;</button>
  </div>
  <ol id="directions-list"></ol>
</div>

<script>
const CITIES = {{ cities|tojson }};
const CENTERS = {{ centers|tojson }};
const MAX_STOPS = {{ max_stops }};
// Defaults to OSRM's free public demo server; a self-hosted production
// deployment can point this elsewhere via the OSRM_BASE_URL env var —
// see app.py and the README's production-path notes.
const OSRM_BASE_URL = {{ osrm_base_url|tojson }};

const satelliteLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community', maxZoom: 19 }
);
const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
});

const map = L.map('map', { layers: [satelliteLayer] }).setView(CENTERS[CITIES[0]], 13);

let clickedPoints = [];   // [[lat, lon], ...]
let pointMarkers = [];    // Leaflet markers for clicked points
let routeLayer = null;    // current drawn route (polyline + numbered stops)

function pinIcon(index, total) {
  const cls = index === 0 ? 'pin-start' : (index === total - 1 ? 'pin-end' : '');
  const label = index === 0 ? 'S' : (index === total - 1 ? 'E' : String(index));
  return L.divIcon({ className: '', html: `<div class="pin-label ${cls}">${label}</div>` });
}

function redrawPins() {
  pointMarkers.forEach(m => map.removeLayer(m));
  pointMarkers = clickedPoints.map((pt, i) =>
    L.marker(pt, { icon: pinIcon(i, clickedPoints.length) }).addTo(map)
  );
  document.getElementById('solveBtn').disabled = clickedPoints.length < 2;
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function addPoint(lat, lon) {
  if (clickedPoints.length >= MAX_STOPS) {
    showError(`Max ${MAX_STOPS} points for a live demo-speed solve — clear and start over if you need more.`);
    return;
  }
  clickedPoints.push([lat, lon]);
  redrawPins();
  document.getElementById('hint').style.display = 'none';
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  document.getElementById('stats').style.display = 'none';
  document.getElementById('directions').style.display = 'none';
}

map.on('click', (e) => addPoint(e.latlng.lat, e.latlng.lng));

document.getElementById('clearBtn').addEventListener('click', () => {
  clickedPoints = [];
  redrawPins();
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  document.getElementById('stats').style.display = 'none';
  document.getElementById('directions').style.display = 'none';
  document.getElementById('hint').style.display = 'block';
});

document.getElementById('basemapSelect').addEventListener('change', (e) => {
  if (e.target.value === 'satellite') { map.removeLayer(streetLayer); map.addLayer(satelliteLayer); }
  else { map.removeLayer(satelliteLayer); map.addLayer(streetLayer); }
});

document.getElementById('citySelect').addEventListener('change', (e) => {
  map.setView(CENTERS[e.target.value], 13);
  clickedPoints = [];
  redrawPins();
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  document.getElementById('stats').style.display = 'none';
  document.getElementById('directions').style.display = 'none';
});

// ---------- Search with live autocomplete (OpenStreetMap Nominatim) ----------

let searchDebounce = null;
let lastSuggestions = [];
const suggestionsEl = document.getElementById('suggestions');
const searchInputEl = document.getElementById('searchInput');

searchInputEl.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  const q = searchInputEl.value.trim();
  if (q.length < 3) { suggestionsEl.style.display = 'none'; return; }
  // Debounced so we're not hammering the free public search service on
  // every keystroke — this is a light, well-behaved amount of traffic.
  searchDebounce = setTimeout(() => fetchSuggestions(q), 400);
});

searchInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (lastSuggestions.length) selectSuggestion(0);
  } else if (e.key === 'Escape') {
    suggestionsEl.style.display = 'none';
  }
});

document.addEventListener('click', (e) => {
  if (!suggestionsEl.contains(e.target) && e.target !== searchInputEl) {
    suggestionsEl.style.display = 'none';
  }
});

async function fetchSuggestions(query) {
  const city = document.getElementById('citySelect').value;
  const fullQuery = `${query}, ${city}, India`;
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&q=${encodeURIComponent(fullQuery)}`;
  try {
    const resp = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    if (!resp.ok) return;
    const results = await resp.json();
    lastSuggestions = results;
    if (!results.length) { suggestionsEl.style.display = 'none'; return; }
    suggestionsEl.innerHTML = results.map((r, i) =>
      `<div class="suggestion" data-i="${i}">${r.display_name}</div>`
    ).join('');
    suggestionsEl.style.display = 'block';
  } catch (err) {
    // Autocomplete failing silently is fine — the user can still press
    // Enter/click Solve normally, or just try again.
  }
}

suggestionsEl.addEventListener('click', (e) => {
  const el = e.target.closest('.suggestion');
  if (!el) return;
  selectSuggestion(parseInt(el.dataset.i, 10));
});

function selectSuggestion(i) {
  const r = lastSuggestions[i];
  if (!r) return;
  const lat = parseFloat(r.lat), lon = parseFloat(r.lon);
  addPoint(lat, lon);
  map.setView([lat, lon], 15);
  searchInputEl.value = '';
  suggestionsEl.style.display = 'none';
  lastSuggestions = [];
}

// ---------- Real road-network routing (OSRM), called from the browser ----------
// Why here and not on our own server: cloud hosts routinely get rate-limited
// or blocked by Overpass/OSM data services (their operators treat datacenter
// IPs as bot traffic). The browser's own ordinary internet connection does
// not have that problem — this is exactly how production map apps do it.

async function osrmTable(points) {
  const coordStr = points.map(p => `${p[1]},${p[0]}`).join(';');
  const url = `${OSRM_BASE_URL}/table/v1/driving/${coordStr}?annotations=duration`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Routing service returned ${resp.status}`);
  const data = await resp.json();
  if (data.code !== 'Ok') {
    throw new Error(data.message || 'Could not compute travel times — a point may be too far from any road (e.g. open water).');
  }
  return data.durations; // seconds, NxN
}

async function osrmRoute(pointsInOrder) {
  const coordStr = pointsInOrder.map(p => `${p[1]},${p[0]}`).join(';');
  const url = `${OSRM_BASE_URL}/route/v1/driving/${coordStr}?overview=full&geometries=geojson&steps=true`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Routing service returned ${resp.status}`);
  const data = await resp.json();
  if (data.code !== 'Ok' || !data.routes || !data.routes.length) {
    throw new Error(data.message || 'Could not find a driving route between those points.');
  }
  const route = data.routes[0];
  const latlngs = route.geometry.coordinates.map(c => [c[1], c[0]]); // GeoJSON is [lon,lat]
  return { latlngs, distance_km: route.distance / 1000, duration_min: route.duration / 60, legs: route.legs || [] };
}

// ---------- Turn-by-turn directions, built from OSRM's per-step maneuver data ----------

function stopLabel(idx, total) {
  if (idx === 0) return 'Start';
  if (idx === total - 1) return 'End';
  return `Stop ${idx}`;
}

function formatHour(hour) {
  const h = Math.floor(hour) % 24;
  const m = Math.round((hour - Math.floor(hour)) * 60);
  const period = h < 12 ? 'AM' : 'PM';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${String(m).padStart(2, '0')} ${period}`;
}

function formatDistance(m) {
  return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m)} m`;
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return `${n}${s[(v - 20) % 10] || s[v] || s[0]}`;
}

function maneuverText(step) {
  const m = step.maneuver || {};
  const name = step.name && step.name.trim() ? step.name : 'the road';
  const mod = m.modifier ? m.modifier.replace('_', ' ') : '';
  switch (m.type) {
    case 'depart':
      return `Head${mod ? ' ' + mod : ''} on ${name}`;
    case 'arrive':
      return `Arrive${mod ? ', destination on the ' + mod : ''}`;
    case 'turn':
    case 'end of road':
      return `Turn ${mod || 'onto'} onto ${name}`;
    case 'merge':
      return `Merge onto ${name}`;
    case 'fork':
      return `Keep ${mod || 'straight'} onto ${name}`;
    case 'ramp':
    case 'on ramp':
    case 'off ramp':
      return `Take the ramp${mod ? ' ' + mod : ''} onto ${name}`;
    case 'roundabout':
    case 'rotary':
      return `Enter the roundabout, take the ${ordinal(m.exit || 1)} exit onto ${name}`;
    case 'exit roundabout':
    case 'exit rotary':
      return `Exit the roundabout onto ${name}`;
    case 'continue':
    case 'new name':
    case 'use lane':
    default:
      return `Continue onto ${name}`;
  }
}

function buildDirections(legs, orderedPoints) {
  const lines = []; // {text, dist, isStopMarker}
  legs.forEach((leg, legIdx) => {
    const steps = leg.steps || [];
    steps.forEach((step, stepIdx) => {
      const isLastStepOfLeg = stepIdx === steps.length - 1;
      let text;
      if (isLastStepOfLeg) {
        const label = stopLabel(legIdx + 1, orderedPoints.length);
        text = legIdx + 1 === orderedPoints.length - 1 ? 'Arrive at your destination' : `Arrive at ${label}`;
      } else {
        text = maneuverText(step);
      }
      lines.push({ text, dist: step.distance, isStopMarker: isLastStepOfLeg });
    });
  });
  return lines;
}

function renderDirections(legs, orderedPoints) {
  const lines = buildDirections(legs, orderedPoints);
  const list = document.getElementById('directions-list');
  list.innerHTML = lines.map(l => `
    <li${l.isStopMarker ? ' class="stop-marker"' : ''}>
      ${l.text}
      ${l.dist > 0 ? `<span class="dist">${formatDistance(l.dist)}</span>` : ''}
    </li>
  `).join('');
  document.getElementById('directions').style.display = 'flex';
}

document.getElementById('directionsClose').addEventListener('click', () => {
  document.getElementById('directions').style.display = 'none';
});

document.getElementById('solveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('solveBtn');
  btn.disabled = true;
  btn.textContent = 'Solving...';
  document.getElementById('hint').style.display = 'none';
  const slowNotice = setTimeout(() => { btn.textContent = 'Still solving...'; }, 6000);

  try {
    const method = document.getElementById('methodSelect').value;
    const hourRaw = document.getElementById('hourSelect').value;
    const hour = hourRaw === 'now' ? (new Date().getHours() + new Date().getMinutes() / 60) : parseFloat(hourRaw);

    // 1. Real road-network FREE-FLOW travel-time matrix (browser -> OSRM).
    // "Free-flow" means no congestion at all — our own server applies a
    // simulated time-of-day traffic model on top of this real baseline
    // (see app.py / src/congestion.py), which is why the numbers you see
    // after solving won't just be "distance / free-flow speed".
    const durations = await osrmTable(clickedPoints);

    // 2. Solve the visiting order under simulated traffic for `hour`
    // (browser -> our server, pure math + congestion model, no maps).
    const solveResp = await fetch('/api/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ matrix: durations, method, hour }),
    });
    const solveData = await solveResp.json();
    if (!solveResp.ok) { showError(solveData.error || 'Solve failed.'); return; }

    // 3. Real street-following geometry for the solved order (browser -> OSRM)
    const orderedPoints = solveData.order.map(i => clickedPoints[i]);
    const routeInfo = await osrmRoute(orderedPoints);

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.layerGroup().addTo(map);
    L.polyline(routeInfo.latlngs, { color: '#2c3e50', weight: 5, opacity: 0.9 }).addTo(routeLayer);

    clickedPoints = orderedPoints;
    redrawPins();
    renderDirections(routeInfo.legs, orderedPoints);

    const clusterNote = solveData.clusters_used > 1
      ? `<br>Solved as ${solveData.clusters_used} clusters (${clickedPoints.length} stops exceeds the single-QUBO limit)`
      : '';
    document.getElementById('stats').style.display = 'block';
    document.getElementById('stats').innerHTML = `
      <b>Route found</b> (${method === 'quantum' ? 'quantum-inspired' : 'classical 2-opt'})<br>
      Distance: <b>${routeInfo.distance_km.toFixed(1)} km</b><br>
      Estimated drive time (${formatHour(hour)} traffic): <b>${solveData.cost_minutes} min</b><br>
      Free-flow (no-traffic) baseline: ${solveData.free_flow_minutes} min<br>
      <span class="warn">${solveData.savings_vs_naive_pct}% faster</span> than visiting stops in click order (${solveData.naive_order_minutes} min)<br>
      Visiting-order solve time: ${solveData.solve_ms} ms<br>
      Road data: real road network (OSRM); traffic: simulated time-of-day model, not live sensors${clusterNote}
    `;
  } catch (err) {
    showError(err.message || 'Request failed.');
  } finally {
    clearTimeout(slowNotice);
    btn.disabled = clickedPoints.length < 2;
    btn.textContent = 'Solve route';
  }
});
</script>
</body>
</html>
